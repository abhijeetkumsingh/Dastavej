{% macro dz(accept, multiple=False, label='', hint='') -%}
<div class="dz-host" data-accept="{{ accept }}" {% if multiple %}data-multiple{% endif %}{% if label %} data-label="{{ label }}"{% endif %}{% if hint %} data-hint="{{ hint }}"{% endif %}></div>
{%- endmacro %}

{% macro actions(label='Run') -%}
<div class="d-flex flex-wrap gap-2 mt-3">
  <button class="btn btn-primary btn-run" type="submit">{{ label }}</button>
  <button class="btn btn-light btn-reset" type="button">Reset</button>
</div>
<div class="result" aria-live="polite"></div>
{%- endmacro %}

{% macro icon(name) -%}
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == 'image' %}<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-8 8"/>
{%- elif name == 'pdf' %}<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>
{%- elif name == 'scan' %}<path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M4 12h16"/>
{%- elif name == 'convert' %}<path d="M17 3l4 4-4 4M21 7H8a4 4 0 0 0-4 4M7 21l-4-4 4-4M3 17h13a4 4 0 0 0 4-4"/>
{%- elif name == 'ai' %}<path d="M12 3l1.8 4.6L18.5 9l-4.7 1.4L12 15l-1.8-4.6L5.5 9l4.7-1.4z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/>
{%- elif name == 'resume' %}<rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="9" r="2.2"/><path d="M8.5 16c.7-2 2-3 3.5-3s2.8 1 3.5 3"/>
{%- elif name == 'passport' %}<rect x="4" y="3" width="16" height="18" rx="2"/><circle cx="12" cy="10" r="3"/><path d="M8 17h8"/>
{%- elif name == 'compress' %}<path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/>
{%- elif name == 'merge' %}<path d="M6 3v6a4 4 0 0 0 4 4h4a4 4 0 0 1 4 4v4M18 3v4M6 21v-4"/>
{%- elif name == 'lock' %}<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>
{%- elif name == 'shield' %}<path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z"/><path d="m9 12 2 2 4-4"/>
{%- elif name == 'sign' %}<path d="M3 21c3-1 4-5 6-5s2 3 4 3 3-3 8-5M14 4l6 6-9 9H5v-6z"/>
{%- endif -%}
</svg>
{%- endmacro %}
